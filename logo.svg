<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">DustBank: a pyramid bank in the desert, its capstone an open eye</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c27a"/><stop offset="0.7" stop-color="#f3dcb0"/><stop offset="1" stop-color="#efe1c4"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a35b"/><stop offset="1" stop-color="#c58a45"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a86f34"/><stop offset="1" stop-color="#8f5a29"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="248"/></clipPath>
  </defs>
  <g clip-path="url(#disc)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="390" cy="150" r="44" fill="#fbe6b8" opacity="0.9"/>
    <!-- far dune -->
    <path d="M0 360 C90 330 170 345 256 352 C350 360 430 330 512 342 V512 H0Z" fill="#e2bf86"/>
    <!-- pyramid body, lit face and shaded face -->
    <path d="M256 150 L120 382 H256 Z" fill="url(#lit)"/>
    <path d="M256 150 L392 382 H256 Z" fill="url(#shade)"/>
    <!-- brick courses -->
    <g stroke="#7a4b22" stroke-opacity="0.35" stroke-width="2">
      <line x1="221" y1="210" x2="291" y2="210"/><line x1="198" y1="250" x2="314" y2="250"/>
      <line x1="174" y1="290" x2="338" y2="290"/>
    </g>
    <!-- the bank front at the base: pediment, columns, steps -->
    <path d="M168 318 L256 296 L344 318 Z" fill="#ead2a2" stroke="#6b4320" stroke-width="3" stroke-linejoin="round"/>
    <rect x="164" y="318" width="184" height="12" fill="#ead2a2" stroke="#6b4320" stroke-width="3"/>
    <g fill="#f1dfb9" stroke="#6b4320" stroke-width="3">
      <rect x="178" y="330" width="16" height="42"/><rect x="218" y="330" width="16" height="42"/>
      <rect x="278" y="330" width="16" height="42"/><rect x="318" y="330" width="16" height="42"/>
    </g>
    <rect x="244" y="340" width="24" height="32" rx="12" ry="12" fill="#3d2410"/>
    <rect x="156" y="372" width="200" height="8" fill="#ead2a2" stroke="#6b4320" stroke-width="3"/>
    <rect x="146" y="380" width="220" height="8" fill="#ead2a2" stroke="#6b4320" stroke-width="3"/>
    <!-- floating capstone with the eye -->
    <g transform="translate(0 -10)">
      <path d="M256 92 L222 146 H290 Z" fill="#f4d58a" stroke="#6b4320" stroke-width="3" stroke-linejoin="round"/>
      <path d="M236 128 Q256 110 276 128 Q256 142 236 128 Z" fill="#fff8e6" stroke="#3d2410" stroke-width="2.5"/>
      <circle cx="256" cy="128" r="6" fill="#2f6b5a"/><circle cx="256" cy="128" r="2.5" fill="#10241e"/>
      <g stroke="#f4d58a" stroke-width="3" stroke-linecap="round" opacity="0.8">
        <line x1="256" y1="78" x2="256" y2="66"/><line x1="226" y1="88" x2="218" y2="78"/><line x1="286" y1="88" x2="294" y2="78"/>
      </g>
    </g>
    <!-- near dune, and the dust blowing off it -->
    <path d="M0 400 C110 372 200 392 280 404 C370 418 440 388 512 396 V512 H0Z" fill="#d6ab6c"/>
    <path d="M0 448 C120 428 230 452 330 458 C420 463 470 446 512 444 V512 H0Z" fill="#c99a5b"/>
    <g fill="#b98a52" opacity="0.55">
      <circle cx="96" cy="300" r="4"/><circle cx="72" cy="318" r="3"/><circle cx="118" cy="330" r="2.5"/>
      <circle cx="420" cy="292" r="4"/><circle cx="446" cy="312" r="3"/><circle cx="402" cy="320" r="2.5"/>
      <circle cx="60" cy="356" r="2"/><circle cx="460" cy="350" r="2"/>
    </g>
    <g fill="none" stroke="#c99a5b" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <path d="M40 286 C70 276 96 282 120 272"/><path d="M392 270 C420 260 444 266 472 256"/>
    </g>
  </g>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#6b4320" stroke-width="8"/>
</svg>
